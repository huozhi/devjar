name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node ${{ matrix.node }} and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: pnpm run build:website

      - name: Test CLI
        run: pnpm test

      - name: Check Package
        run: pnpm test:package
