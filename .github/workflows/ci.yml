name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Node 22
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node 22 and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up browser compiler
        if: hashFiles('compiler/Cargo.toml') != ''
        uses: ./.github/actions/setup-compiler

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: pnpm run build:website

      - name: Typecheck
        run: pnpm typecheck

      - name: Test CLI
        run: pnpm test

      - name: Check Package
        run: pnpm test:package

      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: devjar-package
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Keep this version aligned with Playwright in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    name: Packaged browser
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node 22 and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Use Bun
        # The official image does not include unzip, required by setup-bun.
        run: npm install --global bun

      - name: Download tested package
        uses: actions/download-artifact@v8
        with:
          name: devjar-package
          path: dist/

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Packaged Browser (Chromium)
        run: bun scripts/test-package-browser.ts

      - name: Test Packaged Browser (WebKit)
        run: DEVJAR_TEST_BROWSER=webkit bun scripts/test-package-browser.ts

      - name: Test Next.js host
        run: bun scripts/test-next-host.ts
