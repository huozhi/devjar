name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Node 22
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node 22 and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up browser compiler
        if: hashFiles('compiler/Cargo.toml') != ''
        run: pnpm run setup:compiler

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: pnpm run build:website

      - name: Typecheck
        run: pnpm typecheck

      - name: Test CLI
        run: pnpm test

      - name: Check Package
        run: pnpm test:package

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Packaged browser
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node 22 and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up browser compiler
        if: hashFiles('compiler/Cargo.toml') != ''
        run: pnpm run setup:compiler

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build Package
        run: pnpm run build

      - name: Test Packaged Browser
        run: |
          bun scripts/test-package-browser.ts
          DEVJAR_TEST_BROWSER=webkit bun scripts/test-package-browser.ts

      - name: Test Next.js host
        run: bun scripts/test-next-host.ts
