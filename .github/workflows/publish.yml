name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (leave blank when running directly on a tag)'
        type: string
        required: false
      force:
        description: 'Skip unit and browser tests; still build, typecheck, and check package contents'
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: pnpm/action-setup@v6

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Determine npm tag
        id: npm-tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Git tag $RELEASE_TAG must match package.json version v$version" >&2
            exit 1
          fi
          if [[ "${version%%+*}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm run build

      - name: Install Chromium
        if: ${{ !inputs.force }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Check Package
        run: pnpm typecheck && pnpm test:package

      - name: Test
        if: ${{ !inputs.force }}
        run: pnpm test

      - name: Test Packaged Browser
        if: ${{ !inputs.force }}
        run: bun scripts/test-package-browser.ts

      - name: Record forced publish
        if: github.event_name == 'workflow_dispatch' && inputs.force
        run: echo "Force publishing $RELEASE_TAG with unit and browser tests skipped. Build, typecheck, and package checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "${{ steps.npm-tag.outputs.tag }}" != "latest" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "${release_flags[@]}"
