name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish the current version without bumping it; skip unit and browser tests'
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.force)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Preserve the current notes generator when force switches to an older tag.
      - name: Prepare release notes generator
        run: cp scripts/release-notes.mjs "$RUNNER_TEMP/devjar-release-notes.mjs"

      - name: Determine npm tag
        id: npm-tag
        env:
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [[ "$FORCE" == true && "$GITHUB_REF" == refs/heads/main ]]; then
            RELEASE_TAG="v$version"
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              git checkout --detach "refs/tags/$RELEASE_TAG"
            else
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          fi
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Git tag $RELEASE_TAG must match package.json version v$version" >&2
            exit 1
          fi
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "${version%%+*}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up browser compiler
        if: hashFiles('compiler/Cargo.toml') != '' && hashFiles('.github/actions/setup-compiler/action.yml') != ''
        uses: ./.github/actions/setup-compiler

      - name: Set up compiler for older release tags
        if: hashFiles('compiler/Cargo.toml') != '' && hashFiles('.github/actions/setup-compiler/action.yml') == ''
        run: pnpm run setup:compiler

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm run build

      - name: Install browsers
        if: ${{ !inputs.force }}
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Check Package
        run: pnpm typecheck && pnpm test:package

      - name: Test
        if: ${{ !inputs.force }}
        run: pnpm test

      - name: Test Packaged Browser
        if: ${{ !inputs.force }}
        run: |
          bun scripts/test-package-browser.ts
          DEVJAR_TEST_BROWSER=webkit bun scripts/test-package-browser.ts

      - name: Test Next.js host
        if: ${{ !inputs.force }}
        run: bun scripts/test-next-host.ts

      - name: Record forced publish
        if: github.event_name == 'workflow_dispatch' && inputs.force
        env:
          RELEASE_TAG: ${{ steps.npm-tag.outputs.release-tag }}
        run: echo "Force publishing $RELEASE_TAG with unit and browser tests skipped. Build, typecheck, and package checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether the version is already published
        id: published
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, { signal: AbortSignal.timeout(10000) })
          if (response.status !== 200 && response.status !== 404) throw new Error(`npm registry returned ${response.status}`)
          if (response.status === 200 && (await response.json()).version !== version) throw new Error('Unexpected npm registry response')
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\n`)
          JS

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.npm-tag.outputs.release-tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
            exit 0
          fi
          release_flags=()
          if [[ "${{ steps.npm-tag.outputs.tag }}" != "latest" ]]; then
            release_flags+=(--prerelease)
          fi

          node "$RUNNER_TEMP/devjar-release-notes.mjs" "$RELEASE_TAG" > "$RUNNER_TEMP/devjar-release-notes.md"

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/devjar-release-notes.md" \
            --title "$RELEASE_TAG" \
            "${release_flags[@]}"
